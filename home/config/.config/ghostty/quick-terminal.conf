# Quick Terminal

quick-terminal-position = top
quick-terminal-size = 45%,100%
# MUST stay false until ghostty 1.3.2: `true` triggers upstream bug #11679
# (autohide breaks manual toggle off - window doesn't fully hide, keeps focus).
# Trade-off: QT no longer hides when clicking away; hides only on toggle key.
quick-terminal-autohide = false
quick-terminal-animation-duration = 0.18

# Global keybind
keybind = global:super+grave_accent=toggle_quick_terminal
