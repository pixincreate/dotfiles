# Linux-Only Settings

# GTK Settings
gtk-titlebar = true
gtk-tabs-location = top
# MUST stay explicitly true: ghostty's default is `detect`, which resolves to false
# when launched headless by the D-Bus service (--initial-window=false + flags =>
# probable_cli) -> app never claims com.mitchellh.ghostty -> "Did not receive a reply"
# on app-menu/KRunner launch. Deleting this line re-introduces the bug (ghostty #7038 family).
gtk-single-instance = true

# Performance
linux-cgroup = single-instance

# Blur
# Inert on KDE Plasma 6.7+ (Fedora 44): Plasma dropped org_kde_kwin_blur_manager
# for ext-background-effect-v1, which ghostty 1.3.1 doesn't implement yet.
# Fix is on tip/main (PR #10727, planned 1.3.2) - this line activates it
# automatically after upgrade. Requires background-opacity < 1 (0.88 in appearance.conf).
background-blur = true

# Quick Terminal (Wayland/GTK features)
gtk-quick-terminal-layer = overlay
quick-terminal-keyboard-interactivity = on-demand
