# macOS-Only Settings

# Window & Titlebar
macos-titlebar-style = tabs
macos-window-shadow = true
macos-icon = blueprint
macos-window-buttons = hidden

window-step-resize = true

# Behavior
macos-option-as-alt = true

# Security
# auto-secure-input is unreliable with tmux: its password-prompt detection
# misfires through the tmux layer and Ghostty 1.3.x has a bug where it holds
# Secure Keyboard Entry after focus loss, eating keystrokes at sudo/ssh/git
# prompts. Toggle Secure Keyboard Entry manually via the menu if needed.
# See: https://github.com/ghostty-org/ghostty/discussions/12991
#      https://github.com/ghostty-org/ghostty/discussions/4844
macos-auto-secure-input = false
macos-secure-input-indication = true
macos-shortcuts = ask

# Blur
background-blur = 20

# Updates
auto-update = off
auto-update-channel = stable

# Quick Terminal
quick-terminal-animation-duration = 0.18
quick-terminal-space-behavior = move
