# Key Bindings
## Change prefix from 'Ctrl+B' to 'Ctrl+A'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload Config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# General
set -g renumber-windows on   # renumber all windows when any window is closed
set -g set-clipboard on      # use system clipboard
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g history-limit 50000
setw -g aggressive-resize on
set -g focus-events on
# Keep the server alive with zero sessions so continuum's scheduled
# auto-restore (sleep 1 + restore.sh) can run after a fresh `start-server`;
# with the default exit-empty=on the server dies before restore fires.
set -g exit-empty off

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:RGB'
set -s extended-keys on
# Report modified keys (C-S-letter, C-arrows, etc.) to apps in the modern
# csi-u encoding. Apps using libtickit (pi coding agent) expect csi-u;
# the default xterm format garbles key combinations for them.
set -s extended-keys-format csi-u

# Mouse
set -g mouse on

# Mouse wheel: pass through to apps that handle mouse, else scroll history
bind -T root WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"
bind -T root WheelDownPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "send-keys -M"

# Explicit scroll bindings in copy mode
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Split panes
bind "\\" split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + H/J/K/L - Navigate panes (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt + Shift + H/J/K/L - Swap panes
bind -n M-H swap-pane -d -t -1
bind -n M-J swap-pane -d -t +1

# Alt + Z - Toggle zoom
bind -n M-z resize-pane -Z

# Alt + F - Incremental backward search over full history (tmux 3.3+)
bind -n M-f copy-mode \; command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

# Window navigation
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind R command-prompt "rename-window '%%'"
bind K confirm kill-window

# Close pane
bind x kill-pane

bind -r "<" swap-window -d -t -1
bind -r "," swap-window -d -t -1
bind -r ">" swap-window -d -t +1
bind -r "." swap-window -d -t +1

# Session
bind d detach-client
bind $ command-prompt "rename-session '%%'"
bind S confirm kill-session
bind N new-session -c "#{pane_current_path}"
bind f run-shell "~/.config/tmux/plugins/tmux-fzf-1b3181280a8e/scripts/session.sh switch"
bind L switch-client -l

# Copy mode
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle
bind C run "tmux clear-history; clear"

# Help — manpage-style reference (terse, table-based)
bind ? display-popup -w 70% -h 80% -E "glow -p ~/.config/tmux/README.md"

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Resumes exact opencode sessions on restore (rewrites save file: opencode -> opencode --session <id>)
set -g @plugin 'guysoft/tmux-resurrect-opencode-sessions'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Status bar (light, minimal, readable)
set -g status on
set -g status-interval 5
set -g status-left-length 50
set -g status-right-length 100
set -g status-justify left

# Transparent background with muted foreground
set -g status-style "bg=default,fg=#b0b0b0"

# Left: session name in bright teal accent
set -g status-left "#[fg=#00ffcc,bg=default,bold]#S #[default]"

# Right: current directory basename + date/time
set -g status-right "#[fg=#b0b0b0,bg=default]#{b:pane_current_path} #[fg=#707070]|#[fg=#b0b0b0] %Y-%m-%d %H:%M "

# Windows: gray inactive, bright teal active
set -g window-status-format "#[fg=#808080,bg=default]#I:#W"
set -g window-status-current-format "#[fg=#000000,bg=#00ffcc,bold] #I:#W "
set -g window-status-separator "  "

# Resurrect
# Disabled pane content capture to prevent mouse escape sequence leakage on restore
set -g @resurrect-capture-pane-contents 'off'
# Delete resurrect backups older than 60 days (keeps newest 5)
set -g @resurrect-delete-backup-after '60'

# Continuum (auto-restore sessions)
set -g @continuum-boot 'off' # This is intentional to not trigger Quarantine
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpack/tpm'

