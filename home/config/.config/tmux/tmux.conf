# Key Bindings
## Change prefix from 'Ctrl+B' to 'Ctrl+A'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload Config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# General
set -g renumber-windows on   # renumber all windows when any window is closed
set -g set-clipboard on      # use system clipboard
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g history-limit 50000
setw -g aggressive-resize on
set -g focus-events on

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:RGB'
set -s extended-keys on

# Mouse
set -g mouse on
bind -T root WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"
bind -T root WheelDownPane send-keys -M

# Split panes
bind "\\" split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + H/J/K/L - Navigate panes (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt + Shift + H/J/K/L - Swap panes
bind -n M-H swap-pane -d -t -1
bind -n M-J swap-pane -d -t +1

# Alt + Z - Toggle zoom
bind -n M-z resize-pane -Z

# Alt + F - Search
bind -n M-f copy-mode \; send-keys "?"

# Window navigation
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind R command-prompt "rename-window '%%'"
bind K confirm kill-window

# Close pane
bind x kill-pane

bind -r "<" swap-window -d -t -1
bind -r "," swap-window -d -t -1
bind -r ">" swap-window -d -t +1
bind -r "." swap-window -d -t +1

# Session
bind d detach-client
bind $ command-prompt "rename-session '%%'"
bind S confirm kill-session

# Copy mode
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle
bind C run "tmux clear-history; clear"

# Help
bind ? display-popup -E "glow -p ~/.config/tmux/README.md"

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmuxpack/tpack'

# Status bar (after plugins)
set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-style bg=default,fg=white
set -g status-left "#[fg=#{status-style-fg},bg=#{status-style-bg}] #S "
set -g status-right "#[fg=#{status-style-fg},bg=#{status-style-bg}] %Y-%m-%d %H:%M "

# Resurrect
# Enables save and restore pane content
set -g @resurrect-capture-pane-contents 'on'

# Continuum (auto-restore sessions)
set -g @continuum-boot 'off' # This is intentional to not trigger Quarantine
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpack/tpm'
